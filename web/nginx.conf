# fieldmap-server web front: map printer at /mapprinter/, TileServer GL everywhere else.
server {
    listen 80;
    server_name _;
    absolute_redirect off;   # keep the client's host:port when adding the trailing slash

    location = /mapprinter { return 301 /mapprinter/; }
    location /mapprinter/ {
        alias /usr/share/nginx/html/mapprinter/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Everything else is the tile server (styles, tiles, fonts, sprites, its own index page).
    location / {
        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }
}
