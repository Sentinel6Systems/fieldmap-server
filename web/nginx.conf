# fieldmap-server web front: the map at /map/, User Guide at /guide/, map builder at
# /mapadmin/, the app's routing data at /routing/, TileServer GL everywhere else.
server {
    listen 80;
    server_name _;
    absolute_redirect off;   # keep the client's host:port when adding the trailing slash

    # The map (print/): live sharing, drawing, terrain analysis and printing.
    location = /map { return 301 /map/; }
    location /map/ {
        alias /usr/share/nginx/html/map/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    # The Maps page (TileServer GL's front page) and the print tool's old address open the map;
    # ?style= and #zoom/lat/lon go along (the browser keeps the #part). The old print tool
    # address opens the Print tab. TileServer GL's front page stays on its own port.
    location = / { return 302 /map/$is_args$args; }
    location = /mapprinter { rewrite ^ /map/?print permanent; }
    location = /mapprinter/ { rewrite ^ /map/?print permanent; }
    location /mapprinter/ { rewrite ^/mapprinter/(.*)$ /map/$1 permanent; }

    # The User Guide (guide/), one page with the shared look and header beside it.
    location = /guide { return 301 /guide/; }
    location /guide/ {
        alias /usr/share/nginx/html/guide/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # The World Magnetic Model downloaded by tools/wmm-update.py, and that tool's service
    # (GET status, POST update). Without the file the map uses its built-in model.
    location = /map/wmm/wmm.json {
        alias /usr/share/nginx/wmm/wmm.json;
        add_header Cache-Control "no-cache";
    }
    location /map/wmm-api/ {
        proxy_pass http://wmm:8091/;
        proxy_read_timeout 300;
    }

    # Routing data for the Fieldmap app (scripts/build-routing.sh): the index and BRouter's
    # files, read-only, nothing else and no listing. 404 until a build has made them.
    location = /routing/index.json {
        alias /usr/share/nginx/routing/index.json;
        add_header Cache-Control "no-cache";
    }
    location ~ "^/routing/([EW][0-9]{1,3}_[NS][0-9]{1,2}\.rd5)$" {
        alias /usr/share/nginx/routing/$1;
    }
    # Lines along roads and trails for the map in the browser (brouter/): a route per request,
    # with the app's two profiles and at most 30 points; BRouter's other addresses stay closed.
    # 404 when it finds no way (no routing data there, or no road); 503 while the route service
    # is not running (looked up at each request, so the web front starts without it).
    location = /routing/route {
        limit_except GET { deny all; }
        if ($arg_profile !~ "^(car-vario|hiking-mountain)$") { return 400; }
        if ($arg_lonlats !~ "^-?[0-9.]{1,12},-?[0-9.]{1,12}((\||%7[Cc])-?[0-9.]{1,12},-?[0-9.]{1,12}){1,29}$") { return 400; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $brouter http://fieldmap-brouter:17777;
        proxy_pass $brouter/brouter?lonlats=$arg_lonlats&profile=$arg_profile&alternativeidx=0&format=geojson;
        proxy_read_timeout 900;   # the route service gives up first (ROUTE_TIMEOUT, at most 900 s)
        proxy_intercept_errors on;
        error_page 400 404 500 = @no_way;
        error_page 502 504 = @no_router;
    }
    location @no_way { return 404; }
    location @no_router { return 503; }
    location /routing/ { return 404; }

    # The map builder (tools/admin-server.py, on the machine itself, not in a container),
    # through its socket in the mounted data/admin folder. When it is not running, say so.
    location = /mapadmin { return 301 /mapadmin/; }
    location /mapadmin/ {
        # Left out on purpose (install.sh --no-builder writes this file): the other pages'
        # header then has no link to it (ui/nav.js). Otherwise it says "not running".
        if (-f /run/fieldmap-admin/no-builder) { return 404; }
        proxy_pass http://unix:/run/fieldmap-admin/admin.sock:/;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300;
        error_page 502 503 504 = @no_mapadmin;
    }
    location @no_mapadmin {
        default_type text/plain;
        return 503 "Map Builder is unavailable on this server.\nOn the server, run ./scripts/install.sh (or ./scripts/admin.sh) in the fieldmap-server folder.\n";
    }

    # Remote access for the Fieldmap Android app (tools/remote-server.py, on the machine
    # itself, through its socket): what the app asks when it pairs. Not there
    # until scripts/remote.sh set it up. Only X-Real-IP is added: the service refuses a request
    # that came through another proxy, and answers only callers on the local network.
    location /mapremote/ {
        proxy_pass http://unix:/run/fieldmap-remote/remote.sock:/;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        error_page 502 503 504 = @no_mapremote;
    }
    location @no_mapremote { return 404; }

    # The Devices page (the same service): the app, pairing, the paired devices; and beside it Admin's
    # Remote access page (remote.html): on or off, from outside, port forwarding.
    # Left out on purpose (install.sh --no-remote writes no-remote): the header has no link.
    # Otherwise it says "not running".
    location = /phones { return 301 /phones/; }
    location /phones/ {
        if (-f /run/fieldmap-remote/no-remote) { return 404; }
        proxy_pass http://unix:/run/fieldmap-remote/remote.sock:/;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        error_page 502 503 504 = @no_phones;
    }
    location @no_phones {
        default_type text/plain;
        return 503 "Remote Access is unavailable on this server.\nOn the server, run ./scripts/remote.sh setup in the fieldmap-server folder.\n";
    }

    # Live sharing between the Fieldmap apps (tools/share-server.py, on the machine itself,
    # through its socket): positions and shared markers. X-Real-IP is the caller's address, set
    # here and nowhere else; the service answers only callers on the local network. The header
    # the remote gateway marks its phones with is taken out, so nobody here can pass for one.
    # Not there until scripts/remote.sh set it up.
    location /mapshare/ {
        proxy_pass http://unix:/run/fieldmap-share/share.sock:/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Fieldmap-Fingerprint "";
        client_max_body_size 8k;
        proxy_read_timeout 15;
        error_page 502 504 = @no_mapshare;
    }
    location @no_mapshare { return 404; }

    # Everything else is the tile server (styles, tiles, fonts, sprites, its own index page).
    location / {
        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }
}
