# fieldmap-server: TileServer GL + the browser-based print tool.
# Put your mbtiles files in ./data, then:  docker compose up -d --build
#   http://localhost/          tile server (style list, map viewer, TAK raster tiles)
#   http://localhost/mapprinter/    print a map or an atlas
# Ports and the config file are set in .env (copy .env.example).
services:
  tileserver:
    image: ${TILESERVER_IMAGE:-maptiler/tileserver-gl:v5.7.0}
    container_name: tileserver
    restart: unless-stopped
    # Hard memory cap (no swap). If many TAK clients pull raster tiles at once and the server
    # reaches it, only this container is killed and Docker restarts it in a few seconds.
    mem_limit: ${TILESERVER_MEM_LIMIT:-1g}
    memswap_limit: ${TILESERVER_MEM_LIMIT:-1g}
    ports:
      - "${TILESERVER_PORT:-8080}:8080"
    volumes:
      - ./:/data:ro
    command: --config /data/${TILESERVER_CONFIG:-config.json}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: fieldmap-web
    restart: unless-stopped
    depends_on:
      - tileserver
    ports:
      - "${WEB_PORT:-80}:80"
