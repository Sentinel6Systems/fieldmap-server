# fieldmap-server: TileServer GL + the browser-based map.
# Put your mbtiles files in ./data, then:  docker compose up -d --build
#   http://localhost/map/      the map: live sharing, drawing, terrain analysis, printing
#   http://localhost/          the tile server (TAK raster tiles; its front page opens the map)
#   http://localhost/mapadmin/      choose and build the maps (when scripts/install.sh set it up)
# Ports and the config file are set in .env (copy .env.example).
services:
  tileserver:
    image: ${TILESERVER_IMAGE:-maptiler/tileserver-gl:v5.7.0}
    container_name: tileserver
    restart: unless-stopped
    # Hard memory cap (no swap). If many TAK clients pull raster tiles at once and the server
    # reaches it, only this container is killed and Docker restarts it in a few seconds.
    mem_limit: ${TILESERVER_MEM_LIMIT:-1g}
    memswap_limit: ${TILESERVER_MEM_LIMIT:-1g}
    ports:
      - "${TILESERVER_PORT:-8080}:8080"
    volumes:
      - ./:/data:ro
    command: --config /data/${TILESERVER_CONFIG:-config.json}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: fieldmap-web
    restart: unless-stopped
    depends_on:
      - tileserver
      - wmm
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./data/wmm:/usr/share/nginx/wmm:ro
      # The app's routing data (scripts/build-routing.sh), served as /routing/.
      - ./data/routing:/usr/share/nginx/routing:ro
      # The map builder's socket (scripts/admin.sh), served as /mapadmin/.
      - ./data/admin:/run/fieldmap-admin
      # The remote access service's socket (scripts/remote.sh), served as /mapremote/ and /phones/.
      - ./data/remote/run:/run/fieldmap-remote
      # The sharing service's socket (scripts/remote.sh), served as /mapshare/.
      - ./data/share/run:/run/fieldmap-share

  # Lines along roads and trails for the map in the browser (brouter/): the same engine and
  # profiles as the app, on the routing data. Reached only through the web front (/routing/route).
  brouter:
    build: ./brouter
    container_name: fieldmap-brouter
    restart: unless-stopped
    mem_limit: ${BROUTER_MEM_LIMIT:-512m}
    memswap_limit: ${BROUTER_MEM_LIMIT:-512m}
    volumes:
      - ./data/routing:/segments:ro

  # The gateway for the Fieldmap Android app away from this network: it demands a
  # certificate this box issued and serves only what the app needs. Not started by
  # `docker compose up`: scripts/remote.sh setup makes its certificates and starts it, and
  # updates it every week (nginx's stable line, for its security fixes).
  remote:
    image: ${REMOTE_IMAGE:-nginx:stable-alpine}
    container_name: fieldmap-remote
    profiles: ["remote"]
    restart: unless-stopped
    depends_on:
      - tileserver
    ports:
      # Every address of this machine, IPv4 and IPv6 (scripts/remote.sh sets REMOTE_PUBLISH).
      - "${REMOTE_PUBLISH:-8443}:8443"
    volumes:
      - ./data/remote/gateway:/etc/fieldmap-remote:ro
      - ./data/remote/gateway/nginx:/etc/nginx/conf.d:ro
      - ./data/remote/run:/run/fieldmap-remote
      - ./data/share/run:/run/fieldmap-share
      - ./data/routing:/usr/share/nginx/routing:ro

  # NetBird (netbird.io), the other way in for paired devices, for a box whose router cannot
  # open a port. Not started by `docker compose up`, and not downloaded, until the owner types
  # a setup key on the Remote access page: then scripts/remote.sh netbird-apply starts it.
  # It joins the owner's NetBird network (tools/netbird-run.sh) on this machine's own network,
  # which is why it may change network settings (NET_ADMIN) and nothing else. On its interface
  # the box's firewall lets in the gateway's port only (scripts/firewall.sh). Updated every
  # week with the gateway.
  netbird:
    image: ${NETBIRD_IMAGE:-netbirdio/netbird:latest}
    container_name: fieldmap-netbird
    profiles: ["netbird"]
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      # To read the setup key and write its status in data/remote/netbird, which belong to
      # the owner of this folder. It sees no other file of this machine.
      - DAC_OVERRIDE
    devices:
      - /dev/net/tun
    entrypoint: ["/bin/bash", "/fieldmap-tools/netbird-run.sh"]
    volumes:
      - ./tools:/fieldmap-tools:ro
      - ./data/remote/netbird:/fieldmap
      - ./data/remote/netbird/state:/var/lib/netbird
    # Its own small log files, whatever the machine's default is: Docker's journald driver,
    # which some machines use by default, refuses these options and the container would not start.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Downloads a newer World Magnetic Model when the print tool's "Update magnetic model"
  # button asks for one (tools/wmm-update.py). Reached only through the web container.
  wmm:
    image: ${WMM_IMAGE:-python:3.12-alpine}
    container_name: fieldmap-wmm
    restart: unless-stopped
    volumes:
      - ./tools:/app/tools:ro
      - ./data/wmm:/app/data/wmm
    environment:
      WMM_HOST: 0.0.0.0
      WMM_DIR: /app/data/wmm
    command: python3 /app/tools/wmm-update.py serve
