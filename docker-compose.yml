# fieldmap-server: TileServer GL + the browser-based print tool.
# Put your mbtiles files in ./data, then:  docker compose up -d --build
#   http://localhost/          the Maps page (and the tile server behind it: TAK raster tiles)
#   http://localhost/mapprinter/    print a map or an atlas
#   http://localhost/mapadmin/      choose and build the maps (when scripts/install.sh set it up)
# Ports and the config file are set in .env (copy .env.example).
services:
  tileserver:
    image: ${TILESERVER_IMAGE:-maptiler/tileserver-gl:v5.7.0}
    container_name: tileserver
    restart: unless-stopped
    # Hard memory cap (no swap). If many TAK clients pull raster tiles at once and the server
    # reaches it, only this container is killed and Docker restarts it in a few seconds.
    mem_limit: ${TILESERVER_MEM_LIMIT:-1g}
    memswap_limit: ${TILESERVER_MEM_LIMIT:-1g}
    ports:
      - "${TILESERVER_PORT:-8080}:8080"
    volumes:
      - ./:/data:ro
    command: --config /data/${TILESERVER_CONFIG:-config.json}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: fieldmap-web
    restart: unless-stopped
    depends_on:
      - tileserver
      - wmm
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./data/wmm:/usr/share/nginx/wmm:ro
      # The map builder's socket (scripts/admin.sh), served as /mapadmin/.
      - ./data/admin:/run/fieldmap-admin
      # The remote access service's socket (scripts/remote.sh), served as /mapremote/ and /phones/.
      - ./data/remote/run:/run/fieldmap-remote
      # The sharing service's socket (scripts/remote.sh), served as /mapshare/.
      - ./data/share/run:/run/fieldmap-share

  # The gateway for the Fieldmap Android app away from this network: it demands a
  # certificate this box issued and serves only what the app needs. Not started by
  # `docker compose up`: scripts/remote.sh setup makes its certificates and starts it, and
  # updates it every week (nginx's stable line, for its security fixes).
  remote:
    image: ${REMOTE_IMAGE:-nginx:stable-alpine}
    container_name: fieldmap-remote
    profiles: ["remote"]
    restart: unless-stopped
    depends_on:
      - tileserver
    ports:
      # Every address of this machine, IPv4 and IPv6 (scripts/remote.sh sets REMOTE_PUBLISH).
      - "${REMOTE_PUBLISH:-8443}:8443"
    volumes:
      - ./data/remote/gateway:/etc/fieldmap-remote:ro
      - ./data/remote/gateway/nginx:/etc/nginx/conf.d:ro
      - ./data/remote/run:/run/fieldmap-remote
      - ./data/share/run:/run/fieldmap-share

  # Downloads a newer World Magnetic Model when the print tool's "Update magnetic model"
  # button asks for one (tools/wmm-update.py). Reached only through the web container.
  wmm:
    image: ${WMM_IMAGE:-python:3.12-alpine}
    container_name: fieldmap-wmm
    restart: unless-stopped
    volumes:
      - ./tools:/app/tools:ro
      - ./data/wmm:/app/data/wmm
    environment:
      WMM_HOST: 0.0.0.0
      WMM_DIR: /app/data/wmm
    command: python3 /app/tools/wmm-update.py serve
