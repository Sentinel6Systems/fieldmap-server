# Beside the machine's own nginx (scripts/install-nginx.sh; arm64 or amd64): full image, so TAK
# clients get rendered raster tiles too. Host networking, bound to localhost; the machine's own
# nginx proxies it at /maps. scripts/install-nginx.sh copies this file to the repository root.
# The data folder is data/ there, or FIELDMAP_DATA from .env (install-nginx.sh writes it there).
services:
  tileserver:
    image: maptiler/tileserver-gl@sha256:24d0364e1d40da0ae3fb3269f617c26e36a883ad4b7454e5c4064a8795bfc807  # v5.7.0
    container_name: tileserver
    restart: always
    # Hard memory cap (no swap). If many TAK clients pull raster tiles at once and the server
    # reaches it, only this container is killed and Docker restarts it in a few seconds.
    mem_limit: ${TILESERVER_MEM_LIMIT:-1g}
    memswap_limit: ${TILESERVER_MEM_LIMIT:-1g}
    network_mode: host
    volumes:
      - ./:/data:ro
      - ${FIELDMAP_DATA:-./data}:/data/data:ro
    command: --config /data/config.json --bind 127.0.0.1 --port 8080 --public_url /maps/

  # Lines along roads and trails for the map in the browser (brouter/): the same engine and
  # profiles as the app, on the routing data; on localhost (127.0.0.1:17777), for nginx
  # (/routing/route). Built here by install-nginx.sh (docker build --network host); Docker on the Pi
  # has no network of its own (pi/docker/daemon.json), so the build uses the machine's.
  brouter:
    build:
      context: ./brouter
      network: host
    image: fieldmap-brouter:local
    container_name: fieldmap-brouter
    restart: always
    # A long leg (hundreds of kilometers) needs time more than memory: ROUTE_TIMEOUT seconds a
    # leg (300), within BROUTER_MEM_LIMIT (768m; the Java heap is two thirds of it).
    mem_limit: ${BROUTER_MEM_LIMIT:-768m}
    memswap_limit: ${BROUTER_MEM_LIMIT:-768m}
    network_mode: host
    environment:
      BIND: 127.0.0.1
      ROUTE_TIMEOUT: ${ROUTE_TIMEOUT:-300}
    volumes:
      - ${FIELDMAP_DATA:-./data}/routing:/segments:ro

  # The gateway for the Fieldmap Android app away from this network (scripts/remote.sh setup
  # makes its certificates and starts it; `up -d` alone leaves it out). Host networking like
  # the tile server; it listens on REMOTE_PORT (in .env, chosen at random), IPv4 and IPv6.
  # nginx's stable line, pinned by its digest: a newer one comes with an update of this
  # repository (REMOTE_IMAGE in .env chooses another).
  remote:
    image: ${REMOTE_IMAGE:-nginx@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3}  # 1.30.7-alpine (stable)
    container_name: fieldmap-remote
    profiles: ["remote"]
    restart: always
    mem_limit: 128m
    memswap_limit: 128m
    network_mode: host
    volumes:
      - ${FIELDMAP_DATA:-./data}/remote/gateway:/etc/fieldmap-remote:ro
      - ${FIELDMAP_DATA:-./data}/remote/gateway/nginx:/etc/nginx/conf.d:ro
      - ${FIELDMAP_DATA:-./data}/remote/run:/run/fieldmap-remote
      - ${FIELDMAP_DATA:-./data}/share/run:/run/fieldmap-share
      - ${FIELDMAP_DATA:-./data}/routing:/usr/share/nginx/routing:ro

  # NetBird (netbird.io), the other way in for paired devices, for a box whose router cannot
  # open a port. Not started, and not downloaded, until the owner types a setup key on the
  # Remote access page (scripts/remote.sh netbird-apply; see docker-compose.yml). Pinned by its
  # digest like the gateway.
  netbird:
    image: ${NETBIRD_IMAGE:-netbirdio/netbird@sha256:a2f6a659b281d4d6e9820ed07b6822fddfc992f31a6a01e7b1e65c5ad0fa3072}  # 0.83.2
    container_name: fieldmap-netbird
    profiles: ["netbird"]
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      # To read the setup key and write its status in data/remote/netbird, which belong to
      # the owner of this folder. It sees no other file of this machine.
      - DAC_OVERRIDE
    devices:
      - /dev/net/tun
    entrypoint: ["/bin/bash", "/fieldmap-tools/netbird-run.sh"]
    volumes:
      - ./tools:/fieldmap-tools:ro
      - ${FIELDMAP_DATA:-./data}/remote/netbird:/fieldmap
      - ${FIELDMAP_DATA:-./data}/remote/netbird/state:/var/lib/netbird
    # Its own small log files, whatever the machine's default is: Docker's journald driver,
    # which some machines use by default, refuses these options and the container would not start.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
