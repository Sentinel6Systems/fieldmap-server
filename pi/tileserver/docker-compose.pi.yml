# Raspberry Pi (arm64): full image, so TAK clients get rendered raster tiles too.
# Host networking, bound to localhost; IIAB's nginx proxies it at /maps.
# Copy this file to the repository root on the Pi.
services:
  tileserver:
    image: maptiler/tileserver-gl@sha256:24d0364e1d40da0ae3fb3269f617c26e36a883ad4b7454e5c4064a8795bfc807  # v5.7.0
    container_name: tileserver
    restart: always
    # Hard memory cap (no swap). If many TAK clients pull raster tiles at once and the server
    # reaches it, only this container is killed and Docker restarts it in a few seconds.
    mem_limit: ${TILESERVER_MEM_LIMIT:-1g}
    memswap_limit: ${TILESERVER_MEM_LIMIT:-1g}
    network_mode: host
    volumes:
      - ./:/data:ro
    command: --config /data/config.json --bind 127.0.0.1 --port 8080 --public_url /maps/

  # The gateway for the Fieldmap Android app away from this network (scripts/remote.sh setup
  # makes its certificates and starts it; `up -d` alone leaves it out). Host networking like
  # the tile server; it listens on REMOTE_PORT (in .env, chosen at random), IPv4 and IPv6.
  remote:
    image: ${REMOTE_IMAGE:-nginx:stable-alpine}
    container_name: fieldmap-remote
    profiles: ["remote"]
    restart: always
    network_mode: host
    volumes:
      - ./data/remote/gateway:/etc/fieldmap-remote:ro
      - ./data/remote/gateway/nginx:/etc/nginx/conf.d:ro
      - ./data/remote/run:/run/fieldmap-remote
