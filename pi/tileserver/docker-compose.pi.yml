# Raspberry Pi (arm64): light image, browser-side rendering only.
# Host networking, bound to localhost; IIAB's nginx proxies it at /maps.
# Copy this file and config-pi.json to the repository root on the Pi.
services:
  tileserver:
    image: maptiler/tileserver-gl-light@sha256:c5be4f6c297a2b231299881c7dac859355313a69e674b85276669dd7fd3910e7  # v5.7.0
    container_name: tileserver
    restart: always
    network_mode: host
    volumes:
      - ./:/data:ro
    command: --config /data/config-pi.json --bind 127.0.0.1 --port 8080 --public_url /maps/
