# Print-a-map tool: static files from the fieldmap-server repo.
# Not an IIAB-managed file; added by the emergency-server build.
location = /print { return 301 /print/; }
location /print/ {
    alias /opt/fieldmap-server/print/dist/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
