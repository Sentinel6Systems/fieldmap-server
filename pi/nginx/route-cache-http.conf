# The route cache's store (routing-nginx.conf, /routing/route), at nginx's http level: installed by
# scripts/install-nginx.sh into /etc/nginx/conf.d when the machine's nginx reads that folder there.
# Without it the routes still work, only not kept (install-nginx.sh then leaves out the snippet's
# "route cache" lines). The key holds the routing data's date (v), so new routing data starts
# afresh; an entry not asked for 60 days goes.
proxy_cache_path /var/cache/nginx/fieldmap-routes levels=1:2 keys_zone=fieldmap_routes:10m max_size=300m inactive=60d use_temp_path=off;
