# Routing data for the Fieldmap app (scripts/build-routing.sh): the index and BRouter's files
# from the repo's data/routing/, at /routing/ (not under /maps/). Read-only, nothing else and
# no listing; 404 until a build has made them.
location = /routing/index.json {
    alias /opt/fieldmap-server/data/routing/index.json;
    add_header Cache-Control "no-cache";
}
location ~ "^/routing/([EW][0-9]{1,3}_[NS][0-9]{1,2}\.rd5)$" {
    alias /opt/fieldmap-server/data/routing/$1;
}
# Lines along roads and trails for the map in the browser (brouter/, on 127.0.0.1:17777): a
# route per request, with the app's two profiles and at most 30 points; BRouter's other addresses
# stay closed. 404 when it finds no way (no routing data there, or no road); 503 while the route
# service is not running.
location = /routing/route {
    limit_except GET { deny all; }
    if ($arg_profile !~ "^(car-vario|hiking-mountain|trekking)$") { return 400; }
    # Route Options, Way and avoid areas (print/src/routing.js routeAsk): only these settings, as numbers.
    if ($args !~ "^(lonlats=[^&]+|profile=(car-vario|hiking-mountain|trekking)|format=geojson|v=[0-9]{1,20}|alternativeidx=[0-3]|profile:(avoid_motorways|use_offroad|consider_town|iswet)=1|profile:allow_steps=0|profile:vmax=[0-9]{2,3}|profile:SAC_scale_limit=[1-6]|nogos=-?[0-9.]{1,12},-?[0-9.]{1,12},[0-9]{1,6}(%7[Cc]-?[0-9.]{1,12},-?[0-9.]{1,12},[0-9]{1,6})*|polygons=-?[0-9.]{1,12}(,-?[0-9.]{1,12})+(%7[Cc]-?[0-9.]{1,12}(,-?[0-9.]{1,12})+)*|polylines=-?[0-9.]{1,12}(,-?[0-9.]{1,12})+(%7[Cc]-?[0-9.]{1,12}(,-?[0-9.]{1,12})+)*)(&(lonlats=[^&]+|profile=(car-vario|hiking-mountain|trekking)|format=geojson|v=[0-9]{1,20}|alternativeidx=[0-3]|profile:(avoid_motorways|use_offroad|consider_town|iswet)=1|profile:allow_steps=0|profile:vmax=[0-9]{2,3}|profile:SAC_scale_limit=[1-6]|nogos=-?[0-9.]{1,12},-?[0-9.]{1,12},[0-9]{1,6}(%7[Cc]-?[0-9.]{1,12},-?[0-9.]{1,12},[0-9]{1,6})*|polygons=-?[0-9.]{1,12}(,-?[0-9.]{1,12})+(%7[Cc]-?[0-9.]{1,12}(,-?[0-9.]{1,12})+)*|polylines=-?[0-9.]{1,12}(,-?[0-9.]{1,12})+(%7[Cc]-?[0-9.]{1,12}(,-?[0-9.]{1,12})+)*))*$") { return 400; }
    if ($arg_lonlats !~ "^-?[0-9.]{1,12},-?[0-9.]{1,12}((\||%7[Cc])-?[0-9.]{1,12},-?[0-9.]{1,12}){1,29}$") { return 400; }
    proxy_pass http://127.0.0.1:17777/brouter?$args&format=geojson;
    proxy_read_timeout 900;   # the route service gives up first (ROUTE_TIMEOUT, at most 900 s)
    # The same leg asked again comes from the route cache; one asked twice at once is worked out once.  # route cache
    proxy_cache fieldmap_routes;                                            # route cache
    proxy_cache_key "$args";                                                # route cache
    proxy_cache_valid 200 60d;                                              # route cache
    proxy_ignore_headers Cache-Control Expires Set-Cookie;                  # route cache
    proxy_cache_lock on;                                                    # route cache
    proxy_cache_lock_timeout 900s;                                          # route cache
    proxy_cache_lock_age 900s;                                              # route cache
    add_header X-Route-Cache $upstream_cache_status;                        # route cache
    proxy_intercept_errors on;
    error_page 400 404 500 = @no_way;
    error_page 502 504 = @no_router;
}
location @no_way { return 404; }
location @no_router { return 503; }
location /routing/ { return 404; }
