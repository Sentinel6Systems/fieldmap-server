# Routing data for the Fieldmap app (scripts/build-routing.sh): the index and BRouter's files
# from the repo's data/routing/, at /routing/ (not under /maps/). Read-only, nothing else and
# no listing; 404 until a build has made them. Not an IIAB-managed file.
location = /routing/index.json {
    alias /opt/fieldmap-server/data/routing/index.json;
    add_header Cache-Control "no-cache";
}
location ~ "^/routing/([EW][0-9]{1,3}_[NS][0-9]{1,2}\.rd5)$" {
    alias /opt/fieldmap-server/data/routing/$1;
}
# Lines along roads and trails for the map in the browser (brouter/, on 127.0.0.1:17777): a
# route per request, with the app's two profiles and at most 30 points; BRouter's other addresses
# stay closed. 404 when it finds no way (no routing data there, or no road); 503 while the route
# service is not running.
location = /routing/route {
    limit_except GET { deny all; }
    if ($arg_profile !~ "^(car-vario|hiking-mountain)$") { return 400; }
    if ($arg_lonlats !~ "^-?[0-9.]{1,12},-?[0-9.]{1,12}((\||%7[Cc])-?[0-9.]{1,12},-?[0-9.]{1,12}){1,29}$") { return 400; }
    proxy_pass http://127.0.0.1:17777/brouter?lonlats=$arg_lonlats&profile=$arg_profile&alternativeidx=0&format=geojson;
    proxy_read_timeout 60;
    proxy_intercept_errors on;
    error_page 400 404 500 = @no_way;
    error_page 502 504 = @no_router;
}
location @no_way { return 404; }
location @no_router { return 503; }
location /routing/ { return 404; }
