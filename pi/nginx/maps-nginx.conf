# Offline maps (TileServer GL, Docker, 127.0.0.1:8080).
# Installed by scripts/install-nginx.sh into the folder the server block includes.
location = /maps { return 301 /maps/; }
# The Maps page (TileServer GL's front page) opens the map; ?style= and #zoom/lat/lon go along.
location = /maps/ { return 302 /map/$is_args$args; }
location /maps/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300;   # rendering a raster tile can take a while on a Pi
}
