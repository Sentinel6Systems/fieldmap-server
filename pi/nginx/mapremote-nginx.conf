# Remote access for the Fieldmap Android app (fieldmap-remote.service, tools/remote-server.py):
# what the app asks on this network so that it is let in from outside later. Installed by
# scripts/remote.sh setup. Not an IIAB-managed file.
# Only X-Real-IP is added: the service refuses a request that came through another proxy.
location = /mapremote/info {
    proxy_pass http://127.0.0.1:8092/info;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /mapremote/enrol {
    proxy_pass http://127.0.0.1:8092/enrol;
    proxy_set_header X-Real-IP $remote_addr;
}
