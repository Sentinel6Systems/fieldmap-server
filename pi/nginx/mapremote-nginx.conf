# Remote access for the Fieldmap Android app (fieldmap-remote.service, tools/remote-server.py):
# /mapremote/ is what the app asks when it pairs, /phones/ the Phones page. Installed by
# scripts/remote.sh setup. Not an IIAB-managed file.
# Only X-Real-IP is added: the service refuses a request that came through another proxy, and
# answers only callers on the local network.
location /mapremote/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
}
location = /phones { return 301 /phones/; }
location /phones/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
    error_page 502 503 504 = @no_phones;
}
location @no_phones {
    default_type text/plain;
    return 503 "Remote access for the Fieldmap app is not running on this device.\nOn the device, run: sudo ./scripts/remote.sh setup\n";
}
