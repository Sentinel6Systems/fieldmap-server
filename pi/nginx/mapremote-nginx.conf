# Remote access for the Fieldmap Android app (fieldmap-remote.service, tools/remote-server.py):
# /mapremote/ is what the app asks when it pairs, /phones/ the Devices page. And live sharing
# between the apps (fieldmap-share.service, tools/share-server.py) at /mapshare/. Installed by
# scripts/remote.sh setup. Not an IIAB-managed file.
# Only X-Real-IP is added: the services refuse a request that came through another proxy, and
# answer only callers on the local network.
location /mapremote/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
}
location = /phones { return 301 /phones/; }
location /phones/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
    error_page 502 503 504 = @no_phones;
}
# Positions and shared markers. The header the remote gateway marks its phones with is taken
# out, so nobody here can pass for one. 404 while the service is not running.
location /mapshare/ {
    proxy_pass http://127.0.0.1:8093/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Fieldmap-Fingerprint "";
    client_max_body_size 8k;
    proxy_read_timeout 15;
    error_page 502 504 = @no_mapshare;
}
location @no_mapshare { return 404; }
location @no_phones {
    default_type text/plain;
    return 503 "Remote Access is unavailable on this server.\nOn the server, run: sudo ./scripts/remote.sh setup\n";
}
