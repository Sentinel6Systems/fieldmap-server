# The Map Builder (fieldmap-admin.service, tools/admin-server.py), through its socket in the data
# folder. Installed by scripts/install-nginx.sh into the folder the server block includes.
# Open to everyone who can reach this server unless ADMIN_PIN in .env sets an Access Code.
location = /mapadmin { return 301 /mapadmin/; }
location /mapadmin/ {
    proxy_pass http://unix:/opt/fieldmap-server/data/admin/admin.sock:/;
    proxy_set_header Host $http_host;
    proxy_read_timeout 300;
    error_page 502 503 504 = @no_mapadmin;
}
location @no_mapadmin {
    default_type text/plain;
    return 503 "Map Builder is unavailable on this server.\nOn the server, run: sudo systemctl restart fieldmap-admin\n";
}
