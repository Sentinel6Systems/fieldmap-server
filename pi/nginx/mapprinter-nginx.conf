# The map: static files from the fieldmap-server repo (print/dist), at /map/. Not an
# IIAB-managed file. (The file keeps its old name so that an update replaces it.)
location = /map { return 301 /map/; }
location /map/ {
    alias /opt/fieldmap-server/print/dist/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
# The print tool's old address opens the map's Print tab (?style= and #zoom/lat/lon go along).
location = /mapprinter { rewrite ^ /map/?print permanent; }
location = /mapprinter/ { rewrite ^ /map/?print permanent; }
location /mapprinter/ { rewrite ^/mapprinter/(.*)$ /map/$1 permanent; }
# The User Guide: guide/ from the repo, with the look and the header from ui/.
location = /guide { return 301 /guide/; }
location /guide/ {
    alias /opt/fieldmap-server/guide/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
location = /guide/fieldmap.css {
    alias /opt/fieldmap-server/ui/fieldmap.css;
    add_header Cache-Control "no-cache";
}
location = /guide/nav.js {
    alias /opt/fieldmap-server/ui/nav.js;
    add_header Cache-Control "no-cache";
}
# The World Magnetic Model downloaded by tools/wmm-update.py, and that tool's service
# (fieldmap-wmm.service: GET status, POST update). Without the file the map uses its
# built-in model.
location = /map/wmm/wmm.json {
    alias /opt/fieldmap-server/data/wmm/wmm.json;
    add_header Cache-Control "no-cache";
}
location /map/wmm-api/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_read_timeout 300;
}
