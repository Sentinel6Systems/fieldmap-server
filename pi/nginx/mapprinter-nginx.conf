# Map printer: static files from the fieldmap-server repo, at /mapprinter/
# (not /print/, which is left free for CUPS). Not an IIAB-managed file.
location = /mapprinter { return 301 /mapprinter/; }
location /mapprinter/ {
    alias /opt/fieldmap-server/print/dist/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
