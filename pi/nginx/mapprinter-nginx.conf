# Map printer: static files from the fieldmap-server repo, at /mapprinter/
# (not /print/, which is left free for CUPS). Not an IIAB-managed file.
location = /mapprinter { return 301 /mapprinter/; }
location /mapprinter/ {
    alias /opt/fieldmap-server/print/dist/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
# The World Magnetic Model downloaded by tools/wmm-update.py, and that tool's service
# (fieldmap-wmm.service: GET status, POST update). Without the file the print tool uses its
# built-in model.
location = /mapprinter/wmm/wmm.json {
    alias /opt/fieldmap-server/data/wmm/wmm.json;
    add_header Cache-Control "no-cache";
}
location /mapprinter/wmm-api/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_read_timeout 300;
}
